packages:
  - apps/*
  - packages/*
  - packages/tools/*
catalog:
  '@types/node': 24.19.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  vitest: 5.0.3
# Dependencies allowed to run install scripts. Review before adding anything here.
allowBuilds:
  esbuild: true
  # wrangler's runtime; its postinstall only checks the platform binary that pnpm already
  # installs as an optional dependency.
  workerd: false
