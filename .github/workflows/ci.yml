name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Production build excludes the template tool
        run: |
          if grep -rqE 'template_tool|template-tool' apps/web/dist; then
            echo "::error::The _template tool leaked into the production build"
            exit 1
          fi

  # The suite runs in shards: with the V2 pages it is ~430 tests per browser, which no longer fits
  # Playwright's 12 minute budget in one run (WebKit finished 358 of them before it ended the run).
  # Each browser's tests are split in three runs of about a third, so every test still runs in
  # every browser and each run stays far under its budget. The `e2e` job below keeps the names the
  # repository ruleset requires ("E2E (chromium)" ...).
  e2e-shard:
    name: E2E shard (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's image has the three browsers and their system libraries, so there is no
    # `playwright install --with-deps`: that one downloaded ~50 MB through apt from the runner's
    # Ubuntu mirror, which took over 5 minutes in 9% of 300 jobs, up to 20. The tag must be the
    # version of @playwright/test (Renovate updates both together); the digest pins the image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # When @playwright/test is updated without the image tag, every test would fail at once
      # with "Executable doesn't exist"; say what to change instead.
      - name: Check the image has this Playwright's browsers
        working-directory: apps/web
        run: |
          missing=0
          for dir in $(pnpm exec playwright install --dry-run ${{ matrix.browser }} | awk '/Install location:/ {print $3}'); do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir is not in the image: set its tag in ci.yml to v$(pnpm exec playwright --version | awk '{print $2}')-noble"
              missing=1
            fi
          done
          exit $missing
      # Android's system font, so text before the brand fonts arrive renders in a size-adjusted
      # fallback as on our visitors' phones; the layout-shift test depends on it (ADR 0021).
      - name: Install Roboto
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends fonts-roboto
      # Turborepo groups each task's output in GitHub Actions and prints it only when the task
      # ends, so a run that hit its timeout left an empty log. Streaming shows each test as it
      # finishes. Playwright's own globalTimeout (12 min) ends a stuck run first and writes its
      # report; the step timeout below is the backstop.
      - name: Run smoke tests
        timeout-minutes: 15
        env:
          TURBO_LOG_ORDER: stream
          # Firefox will not start when $HOME, /github/home in a container job, is not owned by
          # the current user (root); Playwright documents this workaround.
          HOME: /root
        run: pnpm test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3
      # Also uploaded when the job passes, so traces of flaky (retried) tests are kept, and when
      # it is cancelled: `always()` still runs after the job's own timeout, `!cancelled()` does
      # not. test-results/ holds traces only for failed attempts, so it is empty on a clean run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # One required check per browser, as before: it passes when every shard of the run passed.
  e2e:
    name: E2E (${{ matrix.browser }})
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "E2E shards: $RESULT"
          test "$RESULT" = "success"
