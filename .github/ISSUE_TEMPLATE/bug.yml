name: Bug report
description: Something does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Mochifile! **Never attach private files.** If a file is
        needed to reproduce the problem, describe it (type, size, dimensions) or share one you
        are comfortable making public.
  - type: input
    id: url
    attributes:
      label: Page
      description: Which page or tool?
      placeholder: https://mochifile.com/pt/...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose a 12 MB HEIC photo
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone 16, Chrome 141 on Windows 11
    validations:
      required: true
